name: LeafLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build React app
        run: npm run build

  backend:
    name: Backend offline tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-api.txt

      - name: Install backend API and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-api.txt pytest

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Run offline backend tests
        working-directory: backend
        run: python -m pytest -q tests
